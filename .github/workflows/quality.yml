name: Quality

on:
  # Run quality checks on every branch, including feature branches.
  push:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and document
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev,docs]"

      - name: Run lint checks
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m basedpyright

      - name: Run Django system checks
        run: python manage.py check --settings=config.test_settings

      - name: Run tests with coverage
        run: python -m coverage run -m pytest -q && python -m coverage report --fail-under=90

      - name: Build Sphinx documentation
        run: python -m sphinx -W -b html docs build/docs

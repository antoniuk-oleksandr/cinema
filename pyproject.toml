[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cinema"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["Django>=5.2,<6", "djangorestframework>=3.16,<4", "djangorestframework-simplejwt>=5.5,<6", "drf-spectacular>=0.28,<1", "django-health-check>=3.20,<4", "python-json-logger>=3.3,<4", "django-prometheus>=2.4,<3", "django-redis>=6,<7", "prometheus-client>=0.22,<1", "opentelemetry-api>=1.36,<2", "opentelemetry-sdk>=1.36,<2", "opentelemetry-exporter-otlp-proto-http>=1.36,<2", "opentelemetry-instrumentation-django>=0.57b0,<1", "psycopg[binary]>=3.2,<4", "redis>=6,<7", "pika>=1.3,<2", "gunicorn>=23,<24", "PyYAML>=6.0,<7"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-django>=4.11", "pytest-cov>=6", "ruff>=0.12"]
docs = ["Sphinx>=8,<10", "myst-parser>=4,<5", "sphinx-autodoc-typehints>=3,<4"]
integration = ["testcontainers[postgres,rabbitmq,redis]>=4.12"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
pythonpath = ["src"]
markers = ["integration", "e2e"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
extend-select = [
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN206",
    "ANN401",
    "ASYNC",
    "B",
    "D",
    "PTH",
    "RET",
    "RUF",
    "S",
    "SIM",
    "UP006",
]
ignore = ["D100", "D104", "D105", "D106", "D107", "D203", "D212", "D213"]
[tool.ruff.lint.per-file-ignores]
".agentflow/**/*.py" = ["ANN201", "ANN202", "ANN204", "ANN206", "D"]
"tests/**/*.py" = ["ANN201", "ANN202", "ANN204", "ANN206", "D", "S101"]
".agentflow/tests/**/*.py" = ["ANN201", "ANN202", "ANN204", "ANN206", "D", "S101"]

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  # The Django service should expose /metrics on port 8000.
  - job_name: cinema-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
